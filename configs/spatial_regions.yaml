# =============================================================================
# Regional sea + continental coverage for spatial enrichment
# =============================================================================
# When a portal tags a record with a regional code (e.g. "MES", "EUR") that is
# not an ISO3 country, this map expands it to a member-country list AND sets
# spatial.scale = "regional". Without this map the record falls through to
# spatial.scale = "global", losing geographic context.
#
# Sources cited per region. When portal data carries newer / different codes,
# extend the map; the closed-codelist ISO3 filter in translate_geonode_v10
# still gates the final output.
#
# Code conventions:
#   - 3-letter UPPERCASE codes for portability (e.g. MES, RED, EUR).
#   - Aliases listed under `aliases` are matched case-insensitively
#     (e.g. "Mediterranean Sea", "med", "MED" all → MES).
# =============================================================================

regional_seas:
  MES:
    name: "Mediterranean Sea"
    sources:
      - "IHO Sea Areas"
      - "UNEP MAP Barcelona Convention contracting parties"
    aliases: ["mediterranean sea", "mediterranean", "med"]
    countries:
      - ALB  # Albania
      - DZA  # Algeria
      - BIH  # Bosnia and Herzegovina
      - HRV  # Croatia
      - CYP  # Cyprus
      - EGY  # Egypt
      - FRA  # France
      - GRC  # Greece
      - ISR  # Israel
      - ITA  # Italy
      - LBN  # Lebanon
      - LBY  # Libya
      - MLT  # Malta
      - MCO  # Monaco
      - MNE  # Montenegro
      - MAR  # Morocco
      - PSE  # Palestine
      - SVN  # Slovenia
      - ESP  # Spain
      - SYR  # Syrian Arab Republic
      - TUN  # Tunisia
      - TUR  # Turkey

  RED:
    name: "Red Sea"
    sources: ["IHO Sea Areas"]
    aliases: ["red sea"]
    countries: [EGY, SDN, ERI, DJI, YEM, SAU, JOR, ISR]

  BLA:
    name: "Black Sea"
    sources: ["IHO Sea Areas"]
    aliases: ["black sea"]
    countries: [TUR, BGR, ROU, UKR, RUS, GEO]

  BAL:
    name: "Baltic Sea"
    sources: ["IHO Sea Areas", "HELCOM contracting parties"]
    aliases: ["baltic sea", "baltic"]
    countries: [DNK, EST, FIN, DEU, LVA, LTU, POL, RUS, SWE]

  NSE:
    name: "North Sea"
    sources: ["IHO Sea Areas", "OSPAR Convention"]
    aliases: ["north sea"]
    countries: [BEL, DNK, FRA, DEU, NLD, NOR, GBR, SWE]

  CAR:
    name: "Caribbean Sea"
    sources: ["IHO Sea Areas", "Cartagena Convention"]
    aliases: ["caribbean sea", "caribbean"]
    countries:
      - ATG  # Antigua and Barbuda
      - BHS  # Bahamas
      - BRB  # Barbados
      - BLZ  # Belize
      - COL  # Colombia
      - CRI  # Costa Rica
      - CUB  # Cuba
      - DMA  # Dominica
      - DOM  # Dominican Republic
      - GRD  # Grenada
      - GTM  # Guatemala
      - GUY  # Guyana
      - HTI  # Haiti
      - HND  # Honduras
      - JAM  # Jamaica
      - MEX  # Mexico
      - NIC  # Nicaragua
      - PAN  # Panama
      - KNA  # Saint Kitts and Nevis
      - LCA  # Saint Lucia
      - VCT  # Saint Vincent and the Grenadines
      - TTO  # Trinidad and Tobago
      - VEN  # Venezuela
      - SUR  # Suriname

  ARS:
    name: "Arabian Sea / Persian Gulf"
    sources: ["IHO Sea Areas", "ROPME Sea Area"]
    aliases: ["arabian sea", "persian gulf", "arabian gulf", "gulf"]
    countries: [BHR, IRN, IRQ, KWT, OMN, QAT, SAU, ARE, YEM, PAK, IND]

  EAS:
    name: "East China Sea"
    sources: ["IHO Sea Areas"]
    aliases: ["east china sea"]
    countries: [CHN, JPN, KOR, TWN]

  SCS:
    name: "South China Sea"
    sources: ["IHO Sea Areas"]
    aliases: ["south china sea"]
    countries: [CHN, VNM, PHL, MYS, BRN, IDN, TWN]

  GOM:
    name: "Gulf of Mexico"
    sources: ["IHO Sea Areas"]
    aliases: ["gulf of mexico"]
    countries: [USA, MEX, CUB]

  GOG:
    name: "Gulf of Guinea"
    sources: ["IHO Sea Areas", "Abidjan Convention"]
    aliases: ["gulf of guinea"]
    countries: [GHA, TGO, BEN, NGA, CMR, GNQ, GAB, COG, COD, AGO, CIV]

  ESI:
    name: "Eastern Indian Ocean (South Asia + Southeast Asia coast)"
    sources: ["IHO Sea Areas - subset"]
    aliases: ["eastern indian ocean"]
    countries: [IND, LKA, MDV, BGD, MMR, THA, MYS, IDN, AUS]

  WIO:
    name: "Western Indian Ocean"
    sources: ["IHO Sea Areas - subset", "Nairobi Convention"]
    aliases: ["western indian ocean"]
    countries: [SOM, KEN, TZA, MOZ, ZAF, MDG, MUS, SYC, COM]

  IOC:
    name: "Indian Ocean (broad)"
    sources: ["IHO Sea Areas"]
    aliases: ["indian ocean"]
    countries:
      # Broad coastal set; refer to WIO/ESI for narrower subsets.
      - SOM
      - KEN
      - TZA
      - MOZ
      - ZAF
      - MDG
      - MUS
      - SYC
      - COM
      - IND
      - LKA
      - MDV
      - BGD
      - MMR
      - THA
      - MYS
      - IDN
      - AUS
      - PAK
      - IRN
      - OMN
      - YEM

# -----------------------------------------------------------------------------
