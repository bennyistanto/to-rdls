# -----------------------------------------------------------------------------
# Glossary of common GeoNode region tags that aren't ISO3
# -----------------------------------------------------------------------------
# Some GeoNode portals use opaque short codes for regions. These are the ones
# we've actually encountered. Add to this table when you spot a new one in
# `_geonode_regions` on a raw record.
known_non_iso3_tags:
  - {tag: "GLO", meaning: "Global", behavior: "leave as scale=global"}
  - {tag: "MES", meaning: "Mediterranean Sea", expand_to: "MES"}    # kmap_inforac
  - {tag: "World",   meaning: "Global", behavior: "leave as scale=global"}
  - {tag: "Africa",  meaning: "Continental Africa", expand_to: "AFR"}
  - {tag: "Europe",  meaning: "Continental Europe", expand_to: "EUR"}
  - {tag: "Asia",    meaning: "Continental Asia",   expand_to: "ASI"}
